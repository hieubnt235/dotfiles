# vim:ft=kitty

## name: Kanagawa
## author: rebelot (palette) — matched to kanagawa.nvim "wave"
## license: MIT
## blurb: Dark, warm, low-contrast — matches the Neovim kanagawa-wave theme.

#: The basic colors

foreground                      #dcd7ba
# bg is #1f1f29, ONE unit off true kanagawa #1f1f28 (used by nvim). This makes the
# shell's default-bg cells transparent while nvim's #1f1f28 cells render opaque.
# The 1-unit difference is invisible. (See background_opacity in kitty.conf.)
background                      #1f1f29
selection_foreground            #c8c093
selection_background            #2d4f67


#: Cursor colors

cursor                          #c8c093
cursor_text_color               #1f1f28


#: URL underline color when hovering with mouse

url_color                       #72a7bc


#: kitty window border colors and terminal bell colors

active_border_color             #7e9cd8
inactive_border_color           #2a2a37
visual_bell_color               none
bell_border_color               #ff5d62


#: Tab bar colors

active_tab_foreground           #1f1f28
active_tab_background           #7e9cd8
inactive_tab_foreground         #dcd7ba
inactive_tab_background         #223249
tab_bar_background              none
tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

mark1_foreground #1f1f28
mark1_background #7fb4ca
mark2_foreground #1f1f28
mark2_background #98bb6c
mark3_foreground #1f1f28
mark3_background #957fb8


#: The basic 16 colors

#: black
color0 #090618
color8 #727169

#: red
color1 #c34043
color9 #e82424

#: green
color2  #76946a
color10 #98bb6c

#: yellow
color3  #c0a36e
color11 #e6c384

#: blue
color4  #7e9cd8
color12 #7fb4ca

#: magenta
color5  #957fb8
color13 #938aa9

#: cyan
color6  #6a9589
color14 #7aa89f

#: white
color7  #c8c093
color15 #dcd7ba
