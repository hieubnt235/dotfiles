clipboard_control write-clipboard write-primary

enabled_layouts splits
map f5 launch --location=hsplit
map f6 launch --location=vsplit

# map ctrl+shift+e --location=vsplit
# map ctrl+shift+o --location=hsplit

map ctrl+shift+cmd+left resize_window narrower
map ctrl+shift++cmd+right resize_window wider
map ctrl+shift++cmd+up resize_window taller
map ctrl+shift+cmd+down resize_window shorter 3
# reset all windows in the tab to default sizes
map ctrl+shift+home resize_window reset
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9



# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# 11 is default
font_size 10 
modify_font cell_height 130%
modify_font cell_width 105%
# Transparency: only cells using the DEFAULT bg below go see-through. nvim sets
# its own bg (#1f1f28), which differs from our default (#1f1f29 in
# current-theme.conf) by 1 invisible unit -- so the shell is transparent but
# nvim stays fully opaque. Tune the level here (1.0 = solid, lower = more see-through).
background_opacity 0.95

# Default for linux is 1.0 0 
text_composition_strategy 2.0 20
# text_composition_strategy legacy

# Cursors 
shell-integration no-cursor
cursor_shape block

cursor none
cursor_text_color background

# Cursor trail: smooth, GPU-rendered animation when the cursor JUMPS. This is
# kitty-native (not an nvim plugin), so it's clean (one solid color, no fringing)
# and works everywhere kitty draws -- nvim, shell, and remote SSH (your local
# kitty renders it). Tuned fast:
#   cursor_trail <ms>            -> animate after the cursor was idle this long; 1 = animate readily
#   cursor_trail_decay <fast> <slow> -> fade time in seconds; smaller = faster/shorter trail
#   cursor_trail_start_threshold <cells> -> skip tiny moves (typing / single-step hjkl); only real jumps
#   cursor_trail_color           -> explicit so `cursor none` above doesn't muddy it (kanagawa oldWhite)
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2
cursor_trail_color #c8c093

confirm_os_window_close -1
map ctrl+shift+w close_window_with_confirmation 

remember_window_size  no
initial_window_width  960
initial_window_height 640
remember_window_position yes


