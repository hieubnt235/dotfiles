clipboard_control write-clipboard write-primary

enabled_layouts splits
map f5 launch --location=hsplit
map f6 launch --location=vsplit

# map ctrl+shift+e --location=vsplit
# map ctrl+shift+o --location=hsplit

map ctrl+shift+cmd+left resize_window narrower
map ctrl+shift++cmd+right resize_window wider
map ctrl+shift++cmd+up resize_window taller
map ctrl+shift+cmd+down resize_window shorter 3
# reset all windows in the tab to default sizes
map ctrl+shift+home resize_window reset
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9



# BEGIN_KITTY_THEME
# Catppuccin-Latte
include current-theme.conf
# END_KITTY_THEME

# Font: JetBrains Mono -- the JetBrains/CLion face. Neovim has NO font setting of
# its own (a TUI just draws into whatever cells the terminal hands it), so this is
# necessarily terminal-wide: shell, tmux and nvim all render in it.
# The family itself is set in the BEGIN_KITTY_FONTS block at the BOTTOM of this
# file -- that block is written by `kitty +kitten choose-fonts` and, being last,
# overrides any font_family set up here. Change the font with that picker, not by
# adding a font_family line here, or the two will silently disagree.

# 11 is default
font_size 9
# modify_font cell_height 100%
# modify_font cell_width 100%

# No symbol_map needed: the font below is the Nerd Font patch of JetBrains Mono,
# so the letters ARE JetBrains Mono (identical to CLion) and the neo-tree /
# lualine / bufferline / mini.icons glyphs live in the SAME file. One font, no
# fallback, nothing to keep in sync.
# Transparency: only cells using the DEFAULT bg below go see-through. nvim sets
# its own bg (#1f1f28), which differs from our default (#1f1f29 in
# current-theme.conf) by 1 invisible unit -- so the shell is transparent but
# nvim stays fully opaque. Tune the level here (1.0 = solid, lower = more see-through).
background_opacity 1
# runtime opacity control (needs a full kitty restart to take effect the first time)
dynamic_background_opacity yes
# single-chord opacity: o = more opaque, i = more transparent, 0 = reset to config
map ctrl+shift+o set_background_opacity +0.2
map ctrl+shift+i set_background_opacity -0.2
map ctrl+shift+0 set_background_opacity default

# Default for linux is 1.0 0 
text_composition_strategy 2.0 20
# text_composition_strategy legacy

# Bell: no sound at all. kitty is what actually plays the audible bell, so disabling
# it here silences every ding regardless of source (tmux window switch, shell, apps).
enable_audio_bell no

# Cursors
shell-integration no-cursor
cursor_shape block
# cursor none
# cursor_text_color background

# Cursor trail: smooth, GPU-rendered animation when the cursor JUMPS. This is
# kitty-native (not an nvim plugin), so it's clean (one solid color, no fringing)
# and works everywhere kitty draws -- nvim, shell, and remote SSH (your local
# kitty renders it). Tuned fast:
#   cursor_trail <ms>            -> animate after the cursor was idle this long; 1 = animate readily
#   cursor_trail_decay <fast> <slow> -> fade time in seconds; smaller = faster/shorter trail
#   cursor_trail_start_threshold <cells> -> skip tiny moves (typing / single-step hjkl); only real jumps
#   cursor_trail_color           -> explicit so `cursor none` above doesn't muddy it (kanagawa oldWhite)
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2
# cursor_trail_color #c8c093

confirm_os_window_close -1
map ctrl+shift+w close_window_with_confirmation 

remember_window_size  no
initial_window_width  960
initial_window_height 640
remember_window_position yes




# "Mono" variant = every added icon glyph is forced to a single cell, so the
# neo-tree indent columns stay aligned. The plain "JetBrainsMono Nerd Font"
# family lets icons render double-width, which ragged the tree.
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
